services:
  sandbox:
    build: .
    image: zeno-sandbox:local
    init: true
    stdin_open: true
    tty: true
    user: "1000:1000"
    working_dir: /workspace
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./workspace:/workspace
